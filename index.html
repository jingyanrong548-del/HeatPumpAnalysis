<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工业双效热泵经济性分析工具 V12 (通用版)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #005A9C;
            --secondary-color: #003366;
            --accent-color: #E87722;
            --bg-color: #f4f7fa;
            --text-color: #333;
            --card-bg: #ffffff;
            --border-color: #dce3e9;
            --success-color: #28a745;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2em 1em;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 960px;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        header {
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 25px 40px;
            text-align: center;
        }

        header h1 { margin: 0; font-size: 2em; }
        header p { margin: 10px 0 0; opacity: 0.9; font-size: 1em; }
        
        main {
            padding: 20px 40px 40px 40px;
        }

        fieldset {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }

        legend {
            font-weight: 600;
            color: var(--secondary-color);
            padding: 0 10px;
            margin-left: 10px;
            font-size: 1.1em;
        }
        
        .input-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }
        
        .input-group { display: flex; flex-direction: column; }
        .input-group label {
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 0.9em;
            display: flex;
            align-items: center;
        }
        
        .input-group .tooltip {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background-color: #e9ecef;
            color: #6c757d;
            border: 1px solid #ced4da;
            font-size: 12px;
            font-weight: bold;
            margin-left: 8px;
            cursor: help;
            transition: all 0.2s;
        }

        .input-group .tooltip:hover {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        
        .input-group input {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1em;
            transition: border-color 0.3s, box-shadow 0.3s;
            width: 100%;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 90, 156, 0.15);
        }

        .button-container { display: flex; gap: 15px; margin-top: 10px; }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary { background-color: var(--accent-color); color: white; flex-grow: 1; }
        .btn-primary:hover { background-color: #d46813; }
        .btn-secondary { background-color: #e9ecef; color: var(--text-color); }
        .btn-secondary:hover { background-color: #ced4da; }
        button:active { transform: translateY(1px); }

        .output-section { display: none; }
        .output-section.visible {
            display: block;
            animation: fadeIn 0.5s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            font-size: 1.6em;
            color: var(--secondary-color);
            border-bottom: 3px solid var(--accent-color);
            padding-bottom: 10px;
            margin: 40px 0 25px 0;
        }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--primary-color);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            text-align: center;
        }
        
        .card.highlight { border-left-color: var(--success-color); }
        .card-title { font-weight: 600; font-size: 1em; margin-bottom: 15px; color: #6c757d; }
        .card-value { font-size: 2.2em; font-weight: 700; color: var(--secondary-color); }
        .card-value.positive { color: var(--success-color); }
        .card-unit { font-size: 0.6em; font-weight: 500; margin-left: 5px; color: #6c757d; }

        .comparison-table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
        .comparison-table th, .comparison-table td { padding: 15px; text-align: left; border-bottom: 1px solid var(--border-color); }
        .comparison-table thead th { background-color: #f8f9fa; font-weight: 600; font-size: 0.9em; text-transform: uppercase; letter-spacing: 0.5px; }
        .comparison-table tbody tr:hover { background-color: #f1f3f5; }
        .comparison-table tbody tr td:first-child { font-weight: 600; color: var(--primary-color); }
        
        .chart-container {
            position: relative;
            height: 400px;
            width: 100%;
            margin-top: 20px;
        }

        .report-section { background-color: #f8f9fa; padding: 25px; border-radius: 8px; border: 1px solid var(--border-color); }
        .report-section p { line-height: 1.7; font-size: 1.05em; }
        .report-section strong { color: var(--secondary-color); }

        .report-actions { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 15px; }

        .calculation-details {
            display: none;
            margin-top: 40px;
            padding: 25px;
            background-color: #f8f9fa;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            animation: fadeIn 0.5s;
        }
        .calculation-details h3 { color: var(--secondary-color); border-bottom: 2px solid var(--border-color); padding-bottom: 8px; margin-top: 0; margin-bottom: 15px; }
        .calculation-details .method-block { margin-bottom: 25px; border-bottom: 1px dashed var(--border-color); padding-bottom: 15px; }
        .calculation-details .method-block:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .calculation-details p { margin: 5px 0 10px 0; font-weight: 500; }
        .calculation-details code {
            display: block;
            background-color: #e9ecef;
            padding: 10px;
            border-radius: 4px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95em;
            color: #333;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        footer {
            text-align: center;
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        footer p {
            margin: 0;
            font-size: 0.9em;
            color: #888;
        }
        
        @media (max-width: 820px) {
            .input-grid, .summary-cards { grid-template-columns: repeat(2, 1fr); }
            main { padding: 20px; }
        }
        
        @media (max-width: 600px) {
            .input-grid, .summary-cards { grid-template-columns: 1fr; }
            .button-container { flex-direction: column; }
        }

        /* --- PRINT STYLES --- */
        @media print {
            @page {
                size: A4;
                margin: 2cm;
            }

            body {
                background-color: #fff;
                padding: 0;
                font-size: 11pt;
            }

            .container {
                box-shadow: none;
                border-radius: 0;
                width: 100%;
                max-width: 100%;
            }

            header p, #analysisForm, .report-actions {
                display: none;
            }

            header {
                background: none;
                color: #000;
                text-align: left;
                padding: 0 0 20px 0;
                border-bottom: 2px solid #333;
            }
            header h1 { font-size: 22pt; }

            main { padding: 0; }

            h2 {
                font-size: 14pt;
                color: #000;
                border-bottom: 2px solid #ccc;
                margin-top: 30px;
                margin-bottom: 15px;
                page-break-after: avoid;
            }

            .output-section, .output-section.visible {
                display: block !important;
                animation: none;
            }

            .summary-cards { grid-template-columns: repeat(3, 1fr); }
            .card { box-shadow: none; border: 1px solid #ccc; }
            .card-value { font-size: 18pt; }
            .card-unit { font-size: 11pt; }
            
            .comparison-table th, .comparison-table td { padding: 8px; font-size: 10pt; }
            .comparison-table th { white-space: nowrap; }

            .chart-container, .comparison-table, .report-section, .calculation-details, .card, .method-block, footer {
                page-break-inside: avoid;
            }
            
            .chart-container {
                margin-top: 15px;
                margin-bottom: 30px;
                height: 280px !important;
                width: 100%;
            }

            .report-section, .calculation-details {
                background-color: #fff;
                border: none;
                padding: 0;
                margin-top: 20px;
            }
            .calculation-details code {
                background-color: #f0f0f0;
                border: 1px solid #ccc;
            }

            footer {
                margin-top: 40px;
                border-top: 1px solid #ccc;
            }
            footer p {
                color: #555;
                font-size: 10pt;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>工业双效热泵经济性分析工具</h1>
            <p>本工具依据国际通用的热电联产(CHP)成本分配原则，帮助您科学核算同时制冷与制热热泵的电力成本。</p>
        </header>

        <main>
            <form id="analysisForm">
                <fieldset>
                    <legend>热泵基础性能</legend>
                    <div class="input-grid">
                        <div class="input-group"><label for="p_total">总输入功率 (P_total)<span class="tooltip" title="热泵压缩机等部件的总耗电功率 (kW)">?</span></label><input type="number" id="p_total" value="100" required></div>
                        <div class="input-group"><label for="qc">总制冷量 (Qc)<span class="tooltip" title="热泵产生的总冷量 (kW)">?</span></label><input type="number" id="qc" value="300" required></div>
                        <div class="input-group"><label for="qh">总制热量 (Qh)<span class="tooltip" title="热泵产生的总热量, 即冷凝热 (kW)">?</span></label><input type="number" id="qh" value="400" required></div>
                    </div>
                </fieldset>
                <fieldset>
                    <legend>计算所需参数</legend>
                    <div class="input-grid">
                        <div class="input-group"><label for="t_env">环境温度 (T_env)<span class="tooltip" title="用于㶲(Exergy)法计算的参考环境温度 (°C)">?</span></label><input type="number" id="t_env" value="25" required></div>
                        <div class="input-group"><label for="t_c">热源温度 (T_c)<span class="tooltip" title="指被冷却介质的温度 (°C)。例如：冷冻水出水温度、被降温的环境空气温度等。">?</span></label><input type="number" id="t_c" value="7" required></div>
                        <div class="input-group"><label for="t_h">热汇温度 (T_h)<span class="tooltip" title="指被加热介质的温度 (°C)。例如：热水出水温度、热风温度、蒸汽的饱和温度等。">?</span></label><input type="number" id="t_h" value="50" required></div>
                    </div>
                </fieldset>
                <fieldset>
                    <legend>经济性分析参数</legend>
                    <div class="input-grid">
                        <div class="input-group"><label for="cop_c_alt">替代制冷COP<span class="tooltip" title="单独制冷时的市场主流设备性能系数(COP)，如离心机组">?</span></label><input type="number" id="cop_c_alt" value="5.0" step="0.1" required></div>
                        <div class="input-group"><label for="cop_h_alt">替代制热COP<span class="tooltip" title="单独制热时的市场主流设备性能系数(COP)，如空气源热泵">?</span></label><input type="number" id="cop_h_alt" value="3.0" step="0.1" required></div>
                        <div class="input-group"><label for="price">本地工业电价<span class="tooltip" title="单位：元/kWh">?</span></label><input type="number" id="price" value="0.8" step="0.01" required></div>
                    </div>
                </fieldset>
                <div class="button-container">
                    <button type="submit" class="btn-primary">开始分析</button>
                    <button type="reset" class="btn-secondary" id="resetBtn">重置数据</button>
                </div>
            </form>

            <section class="output-section" id="outputSection">
                <h2>核心结论摘要 (基于替代生产法)</h2>
                <div class="summary-cards">
                    <div class="card"><div class="card-title">制冷分配成本</div><div class="card-value"><span id="summary_cost_c"></span><span class="card-unit">元/小时</span></div></div>
                    <div class="card"><div class="card-title">制热分配成本</div><div class="card-value"><span id="summary_cost_h"></span><span class="card-unit">元/小时</span></div></div>
                    <div class="card highlight"><div class="card-title">每小时节约成本</div><div class="card-value positive"><span id="summary_saving"></span><span class="card-unit">元</span></div></div>
                </div>

                <h2>三种分配方法对比</h2>
                <div style="overflow-x:auto;">
                    <table class="comparison-table">
                        <thead><tr><th>分配方法</th><th>制冷分配功率 (kW)</th><th>制热分配功率 (kW)</th><th>制冷成本 (元/小时)</th><th>制热成本 (元/小时)</th></tr></thead>
                        <tbody>
                            <tr><td>替代生产法</td><td id="alt_pc"></td><td id="alt_ph"></td><td id="alt_cost_c"></td><td id="alt_cost_h"></td></tr>
                            <tr><td>㶲(Exergy)法</td><td id="ex_pc"></td><td id="ex_ph"></td><td id="ex_cost_c"></td><td id="ex_cost_h"></td></tr>
                            <tr><td>能量法</td><td id="en_pc"></td><td id="en_ph"></td><td id="en_cost_c"></td><td id="en_cost_h"></td></tr>
                        </tbody>
                    </table>
                </div>

                <h2>可视化图表：功率分配比例</h2>
                <div class="chart-container">
                    <canvas id="powerChart"></canvas>
                </div>

                <div class="report-section" style="margin-top: 40px;">
                    <h2>分析报告与结论建议</h2>
                    <p id="reportText"></p>
                    <div class="report-actions">
                         <button class="btn-secondary" onclick="window.print()">🖨️ 打印本页报告</button>
                         <button class="btn-secondary" id="copyBtn">📋 复制结论文本</button>
                         <button class="btn-secondary" id="toggleDetailsBtn">🔍 显示详细计算过程</button>
                    </div>
                </div>

                <section class="calculation-details" id="calculationDetailsSection">
                    <div id="detailsContent"></div>
                </section>
            </section>

            <footer>
                <p>编者：荆炎荣</p>
            </footer>
        </main>
    </div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('analysisForm');
    const resetBtn = document.getElementById('resetBtn');
    const outputSection = document.getElementById('outputSection');
    const copyBtn = document.getElementById('copyBtn');
    const toggleDetailsBtn = document.getElementById('toggleDetailsBtn');
    const calculationDetailsSection = document.getElementById('calculationDetailsSection');
    
    let powerChart = null;
    let lastAnalysisResults = null;

    form.addEventListener('submit', function(e) { e.preventDefault(); runAnalysis(); });
    resetBtn.addEventListener('click', function() {
        outputSection.classList.remove('visible');
        calculationDetailsSection.style.display = 'none';
        toggleDetailsBtn.innerHTML = '🔍 显示详细计算过程';
        lastAnalysisResults = null;
    });
    
    copyBtn.addEventListener('click', function() {
        if (!lastAnalysisResults) return;
        const reportText = document.getElementById('reportText').innerText;
        navigator.clipboard.writeText(reportText).then(() => {
            copyBtn.innerText = '✅ 已复制!';
            setTimeout(() => { copyBtn.innerText = '📋 复制结论文本'; }, 2000);
        }).catch(err => { alert('复制失败: ', err); });
    });

    toggleDetailsBtn.addEventListener('click', () => {
        if (!lastAnalysisResults) return;
        const isVisible = calculationDetailsSection.style.display === 'block';
        calculationDetailsSection.style.display = isVisible ? 'none' : 'block';
        toggleDetailsBtn.innerHTML = isVisible ? '🔍 显示详细计算过程' : '🔼 隐藏详细计算过程';
        if (!isVisible) {
            calculationDetailsSection.scrollIntoView({ behavior: 'smooth' });
        }
    });

    function runAnalysis() {
        const p_total = parseFloat(document.getElementById('p_total').value);
        const qc = parseFloat(document.getElementById('qc').value);
        const qh = parseFloat(document.getElementById('qh').value);
        const t_env_c = parseFloat(document.getElementById('t_env').value);
        const t_c_c = parseFloat(document.getElementById('t_c').value);
        const t_h_c = parseFloat(document.getElementById('t_h').value);
        const cop_c_alt = parseFloat(document.getElementById('cop_c_alt').value);
        const cop_h_alt = parseFloat(document.getElementById('cop_h_alt').value);
        const price = parseFloat(document.getElementById('price').value);

        if ([p_total, qc, qh, t_env_c, t_c_c, t_h_c, cop_c_alt, cop_h_alt, price].some(isNaN) || p_total <= 0) {
            alert('请输入所有有效的正数。');
            return;
        }

        const results = calculateAllMethods(p_total, qc, qh, t_env_c, t_c_c, t_h_c, cop_c_alt, cop_h_alt, price);
        if(!results) return;
        
        lastAnalysisResults = results;
        displayResults(results);
        populateCalculationDetails(results);
    }

    function calculateAllMethods(p_total, qc, qh, t_env_c, t_c_c, t_h_c, cop_c_alt, cop_h_alt, price) {
        const en_pc = qc + qh > 0 ? p_total * (qc / (qc + qh)) : 0;
        const en_ph = qc + qh > 0 ? p_total * (qh / (qc + qh)) : 0;

        const t_env_k = t_env_c + 273.15;
        const t_c_k = t_c_c + 273.15;
        const t_h_k = t_h_c + 273.15;
        if (t_c_k <= 0 || t_h_k <= t_env_k) {
             alert('㶲(Exergy)法计算错误：请检查温度设置是否合理（热源温度需 > 0K，热汇温度需 > 环境温度）。');
             return null;
        }
        const ex_c = qc * Math.abs((t_env_k / t_c_k) - 1);
        const ex_h = qh * (1 - (t_env_k / t_h_k));
        const total_ex = ex_c + ex_h;
        const ex_pc = total_ex > 0 ? p_total * (ex_c / total_ex) : 0;
        const ex_ph = total_ex > 0 ? p_total * (ex_h / total_ex) : 0;

        const p_c_alt = qc / cop_c_alt;
        const p_h_alt = qh / cop_h_alt;
        const total_p_alt = p_c_alt + p_h_alt;
        const alt_pc = total_p_alt > 0 ? p_total * (p_c_alt / total_p_alt) : 0;
        const alt_ph = total_p_alt > 0 ? p_total * (p_h_alt / total_p_alt) : 0;
        
        const cost_alt = total_p_alt * price;
        const cost_heatpump = p_total * price;
        const saving_per_hour = cost_alt - cost_heatpump;

        return {
            p_total, qc, qh, t_env_c, t_c_c, t_h_c, cop_c_alt, cop_h_alt, price,
            t_env_k, t_c_k, t_h_k,
            en_pc, en_ph,
            ex_c, ex_h, ex_pc, ex_ph,
            p_c_alt, p_h_alt, total_p_alt, alt_pc, alt_ph,
            cost_alt, cost_heatpump, saving_per_hour
        };
    }

    function displayResults(r) {
        outputSection.classList.add('visible');
        const format = (num) => num.toFixed(2);

        document.getElementById('summary_cost_c').innerText = format(r.alt_pc * r.price);
        document.getElementById('summary_cost_h').innerText = format(r.alt_ph * r.price);
        document.getElementById('summary_saving').innerText = format(r.saving_per_hour);
        
        document.getElementById('alt_pc').innerText = format(r.alt_pc);
        document.getElementById('alt_ph').innerText = format(r.alt_ph);
        document.getElementById('alt_cost_c').innerText = format(r.alt_pc * r.price);
        document.getElementById('alt_cost_h').innerText = format(r.alt_ph * r.price);
        
        document.getElementById('ex_pc').innerText = format(r.ex_pc);
        document.getElementById('ex_ph').innerText = format(r.ex_ph);
        document.getElementById('ex_cost_c').innerText = format(r.ex_pc * r.price);
        document.getElementById('ex_cost_h').innerText = format(r.ex_ph * r.price);

        document.getElementById('en_pc').innerText = format(r.en_pc);
        document.getElementById('en_ph').innerText = format(r.en_ph);
        document.getElementById('en_cost_c').innerText = format(r.en_pc * r.price);
        document.getElementById('en_cost_h').innerText = format(r.en_ph * r.price);

        const cooling_percent_alt = r.p_total > 0 ? (r.alt_pc / r.p_total * 100).toFixed(1) : 0;
        const heating_percent_alt = r.p_total > 0 ? (r.alt_ph / r.p_total * 100).toFixed(1) : 0;
        document.getElementById('reportText').innerHTML = `<strong>结论摘要:</strong> 根据输入参数，采用业界公认的<strong>替代生产法</strong>进行分析，建议将总电力成本的 ${cooling_percent_alt}% 分配给制冷，${heating_percent_alt}% 分配给制热。该热泵系统相较于独立的制冷和制热系统，展现出显著的经济优势，预计每运行一小时可节省 <strong>${format(r.saving_per_hour)}</strong> 元。<br><br>
            <strong>方法论说明:</strong><br>
            - <strong>替代生产法:</strong> 基于市场机会成本，最能反映技术的经济性，建议作为商业决策和财务核算的主要依据。<br>
            - <strong>㶲(Exergy)法:</strong> 基于热力学第二定律，物理意义最严谨，适用于严谨的技术分析。<br>
            - <strong>能量法:</strong> 计算最简单直观，但忽略了能量品质差异，可作为初步参考。`;
        
        renderChart([r.alt_pc, r.ex_pc, r.en_pc], [r.alt_ph, r.ex_ph, r.en_ph], false);
        outputSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function populateCalculationDetails(r) {
        const format = (num) => num.toFixed(2);
        const detailsContent = `
            <div class="method-block">
                <h3>经济效益 (成本节约) 计算过程</h3>
                <p><b>思路：</b>对比【使用热泵的实际成本】与【使用传统独立设备满足同等冷热需求的替代成本】。</p>
                <p><b>第1步：计算传统方式 (替代方案) 的总成本</b></p>
                <p>1a. 独立制冷所需功率 (P_c_alt):</p>
                <code>P_c_alt = Qc / COP_c_alt = ${r.qc.toFixed(2)} / ${r.cop_c_alt.toFixed(2)} = ${format(r.p_c_alt)} kW</code>
                <p>1b. 独立制热所需功率 (P_h_alt):</p>
                <code>P_h_alt = Qh / COP_h_alt = ${r.qh.toFixed(2)} / ${r.cop_h_alt.toFixed(2)} = ${format(r.p_h_alt)} kW</code>
                <p>1c. 传统方式总功率 (P_total_alt):</p>
                <code>P_total_alt = P_c_alt + P_h_alt = ${format(r.p_c_alt)} + ${format(r.p_h_alt)} = ${format(r.total_p_alt)} kW</code>
                <p>1d. 传统方式总成本 (Cost_alt):</p>
                <code>Cost_alt = P_total_alt * 电价 = ${format(r.total_p_alt)} * ${r.price.toFixed(2)} = ${format(r.cost_alt)} 元/小时</code>
                <p style="margin-top:20px;"><b>第2步：计算热泵的实际成本</b></p>
                <code>Cost_HeatPump = P_total * 电价 = ${r.p_total.toFixed(2)} * ${r.price.toFixed(2)} = ${format(r.cost_heatpump)} 元/小时</code>
                <p style="margin-top:20px;"><b>第3步：计算每小时节约成本</b></p>
                <code>节约成本 = Cost_alt - Cost_HeatPump = ${format(r.cost_alt)} - ${format(r.cost_heatpump)} = ${format(r.saving_per_hour)} 元/小时</code>
            </div>
            <div class="method-block">
                <h3>替代生产法分配过程</h3>
                <p>1. 分配制冷功率 (Pc):</p>
                <code>Pc = P_total * [P_c_alt / (P_c_alt + P_h_alt)]</code>
                <code>Pc = ${r.p_total.toFixed(2)} * [${format(r.p_c_alt)} / (${format(r.p_c_alt)} + ${format(r.p_h_alt)})] = ${format(r.alt_pc)} kW</code>
                <p>2. 分配制热功率 (Ph):</p>
                <code>Ph = P_total * [P_h_alt / (P_c_alt + P_h_alt)]</code>
                <code>Ph = ${r.p_total.toFixed(2)} * [${format(r.p_h_alt)} / (${format(r.p_c_alt)} + ${format(r.p_h_alt)})] = ${format(r.alt_ph)} kW</code>
            </div>
            <div class="method-block">
                <h3>㶲(Exergy)法计算过程</h3>
                <p>1. 温度单位转换 (摄氏°C -> 开尔文K):</p>
                <code>T_env=${r.t_env_c}°C+273.15=${format(r.t_env_k)}K; T_c=${r.t_c_c}°C+273.15=${format(r.t_c_k)}K; T_h=${r.t_h_c}°C+273.15=${format(r.t_h_k)}K</code>
                <p>2. 计算制冷㶲 (Ex_c):</p>
                <code>Ex_c = Qc * |(T_env / T_c) - 1| = ${r.qc.toFixed(2)} * |(${format(r.t_env_k)} / ${format(r.t_c_k)}) - 1| = ${format(r.ex_c)}</code>
                <p>3. 计算制热㶲 (Ex_h):</p>
                <code>Ex_h = Qh * [1 - (T_env / T_h)] = ${r.qh.toFixed(2)} * [1 - (${format(r.t_env_k)} / ${format(r.t_h_k)})] = ${format(r.ex_h)}</code>
                <p>4. 分配制冷功率 (Pc):</p>
                <code>Pc = P_total * [Ex_c / (Ex_c + Ex_h)] = ${r.p_total.toFixed(2)} * [${format(r.ex_c)} / (${format(r.ex_c)} + ${format(r.ex_h)})] = ${format(r.ex_pc)} kW</code>
                <p>5. 分配制热功率 (Ph):</p>
                <code>Ph = P_total * [Ex_h / (Ex_c + Ex_h)] = ${r.p_total.toFixed(2)} * [${format(r.ex_h)} / (${format(r.ex_c)} + ${format(r.ex_h)})] = ${format(r.ex_ph)} kW</code>
            </div>
            <div class="method-block">
                <h3>能量法计算过程</h3>
                <p>1. 分配制冷功率 (Pc):</p>
                <code>Pc = P_total * [Qc / (Qc + Qh)] = ${r.p_total.toFixed(2)} * [${r.qc.toFixed(2)} / (${r.qc.toFixed(2)} + ${r.qh.toFixed(2)})] = ${format(r.en_pc)} kW</code>
                <p>2. 分配制热功率 (Ph):</p>
                <code>Ph = P_total * [Qh / (Qc + Qh)] = ${r.p_total.toFixed(2)} * [${r.qh.toFixed(2)} / (${r.qc.toFixed(2)} + ${r.qh.toFixed(2)})] = ${format(r.en_ph)} kW</code>
            </div>
        `;
        document.getElementById('detailsContent').innerHTML = detailsContent;
    }

    function renderChart(coolingData, heatingData, isForPrint) {
        const ctx = document.getElementById('powerChart').getContext('2d');
        if (powerChart) powerChart.destroy();
        
        const chartOptions = {
            animation: isForPrint ? false : {},
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                title: { display: false },
                tooltip: { mode: 'index', intersect: false },
                legend: {
                    position: 'bottom',
                    align: 'center',
                    labels: { boxWidth: 20 }
                }
            },
            scales: {
                x: { stacked: true },
                y: {
                    stacked: true,
                    beginAtZero: true,
                    title: { display: true, text: '功率 (kW)' }
                }
            }
        };

        powerChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['替代生产法', '㶲(Exergy)法', '能量法'],
                datasets: [
                    { label: '制冷分配功率 (kW)', data: coolingData, backgroundColor: 'rgba(54, 162, 235, 0.7)' },
                    { label: '制热分配功率 (kW)', data: heatingData, backgroundColor: 'rgba(255, 99, 132, 0.7)' }
                ]
            },
            options: chartOptions
        });
    }

    window.addEventListener('beforeprint', () => {
        if (lastAnalysisResults) {
            const r = lastAnalysisResults;
            renderChart([r.alt_pc, r.ex_pc, r.en_pc], [r.alt_ph, r.ex_ph, r.en_ph], true);
        }
    });

    window.addEventListener('afterprint', () => {
        if (lastAnalysisResults) {
            const r = lastAnalysisResults;
            renderChart([r.alt_pc, r.ex_pc, r.en_pc], [r.alt_ph, r.ex_ph, r.en_ph], false);
        }
    });
});
</script>

</body>
</html>
